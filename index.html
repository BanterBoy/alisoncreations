<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alison Resin Creations</title>

    <!-- Slick CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel/slick/slick.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel/slick/slick-theme.css" />

    <!-- Lightbox CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css">

    <style>
        body {
            background-color: #000;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            color: #ffcc00;
        }

        .carousel {
            width: 80%;
            margin: auto;
        }

        .carousel img {
            width: 100%;
            height: auto;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Alison Resin Creations</h1>
        <p>Handcrafted resin art pieces with passion and creativity.</p>
        <p>Explore our latest works below!</p>

        <div class="carousel"></div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Slick JS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/slick-carousel/slick/slick.min.js"></script>

    <!-- Lightbox JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/js/lightbox.min.js"></script>

    <script>
        $(document).ready(function () {
            fetch('images.json')
                .then(response => response.json())
                .then(images => {
                    let carousel = $('.carousel');
                    images.forEach(img => {
                        carousel.append(`
                            <a href="${img.src}" data-lightbox="gallery" data-title="${img.description}">
                                <img src="${img.src}" alt="${img.description}">
                            </a>
                        `);
                    });

                    carousel.slick({
                        dots: true,
                        infinite: true,
                        speed: 300,
                        slidesToShow: 3,
                        slidesToScroll: 1,
                        autoplay: true,
                        autoplaySpeed: 2000,
                    });
                })
                .catch(error => console.error("Error loading images.json:", error));
        });
    </script>

</body>

</html>
