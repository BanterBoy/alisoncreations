<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alison Resin Creations</title>

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel/slick/slick.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel/slick/slick-theme.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-lightbox/dist/slick-lightbox.css" />

    <!-- jQuery & Slick -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/slick-carousel/slick/slick.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/slick-lightbox/dist/slick-lightbox.min.js"></script>
</head>

<body>

    <!-- Logo -->
    <img src="logo.png" class="logo" alt="Alison Resin Creations">

    <!-- Business Name -->
    <h1>Alison Resin Creations</h1>
    <p>Handmade resin artwork and crafts</p>

    <!-- ✅ Gallery Exists BEFORE Script Loads -->
    <div class="carousel-container">
        <div id="gallery" class="carousel"></div>
    </div>

    <!-- ✅ Script is at the bottom so it runs AFTER the page loads -->
    <script src="script.js"></script>

</body>

</html>
