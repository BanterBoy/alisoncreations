<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alison Resin Creations - Handmade Resin Art</title>

    <!-- Google Font (Montserrat - Elegant & Professional) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">

    <!-- Favicon (Logo) -->
    <link rel="icon" type="image/png" href="https://alisoncreations.co.uk/Gold%20Luxury%20Initial%20Circle%20Logo.png">

    <script defer src="script.js"></script>
</head>

<body>

    <!-- Website Header -->
    <header>
        <img src="https://alisoncreations.co.uk/Gold%20Luxury%20Initial%20Circle%20Logo.png"
            alt="Alison Resin Creations Logo" class="logo">
        <h1>Alison Resin Creations</h1>
        <p>Handmade Resin Art & Custom Creations</p>
    </header>

    <!-- Gallery Section -->
    <section>
        <h2>Our Resin Art Collection</h2>
        <div class="gallery" id="gallery"></div>
    </section>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
        <span class="close" onclick="closeLightbox()">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
        <div id="lightbox-caption"></div>
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2024 Alison Resin Creations. All Rights Reserved.</p>
    </footer>

</body>

</html>
