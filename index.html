<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alison Resin Creations</title>

    <!-- Slick Carousel CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel/slick/slick.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel/slick/slick-theme.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Logo -->
    <img src="https://alisoncreations.co.uk/Gold%20Luxury%20Initial%20Circle%20Logo.png"
        alt="Alison Resin Creations Logo" class="logo">

    <!-- Business Info -->
    <header>
        <h1>Alison Resin Creations</h1>
        <p>Handmade resin artwork and crafts</p>
    </header>

    <!-- Carousel Container -->
    <div class="carousel-container">
        <div class="carousel"></div>
    </div>

    <!-- Lightbox for Large Image Preview -->
    <div class="lightbox">
        <span class="close">&times;</span>
        <img id="lightbox-img" src="" alt="Large Image">
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Slick Carousel JS -->
    <script src="https://cdn.jsdelivr.net/npm/slick-carousel/slick/slick.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>

</body>

</html>
